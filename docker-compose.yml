services:
  backend:
    build: ./backend
    container_name: family-hero-hub-backend
    volumes:
      - ./data:/app/data
      - ./tmp/backup-status:/app/host-status/backup-status:ro
      - ./tmp/scheduled-status:/app/host-status/scheduled-status:ro
    env_file:
      - .env
    ports:
      - "10.250.50.5:8000:8000"
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 4 http://127.0.0.1:8000/api/ready >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  notification_scheduler:
    build: ./backend
    container_name: family-hero-hub-notification-scheduler
    volumes:
      - ./data:/app/data
    env_file:
      - .env
      - .env.push
    command: ["python", "-m", "app.messaging_notification_worker"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "scripts/check_worker_heartbeat.py", "notification"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  messaging_production_worker:
    build: ./backend
    container_name: class-hero-hub-messaging-production-worker
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    command: ["python", "-m", "app.messaging_production_worker"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "scripts/check_worker_heartbeat.py", "production"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: family-hero-hub-frontend
    env_file:
      - .env
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    build:
      context: ./postgres
    container_name: family-hero-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-family_hero_hub}
      POSTGRES_USER: ${POSTGRES_USER:-familyhero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    env_file:
      - .env.backup
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=fhh archive-push %p
      - -c
      - archive_timeout=300s
      - -c
      - max_wal_senders=3
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - pgbackrest_repo_encrypted:/var/lib/pgbackrest
      - ./postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - /home/administrator/.config/class-hero-hub/backup-ssh:/run/secrets/backup-ssh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familyhero} -d ${POSTGRES_DB:-family_hero_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_restore:
    build:
      context: ./postgres
    container_name: family-hero-hub-postgres-restore
    restart: "no"
    profiles:
      - restore
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-family_hero_hub}
      POSTGRES_USER: ${POSTGRES_USER:-familyhero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    env_file:
      - .env.backup
    volumes:
      - postgres_restore_data:/var/lib/postgresql/data
      - pgbackrest_repo_encrypted:/var/lib/pgbackrest
      - ./postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - /home/administrator/.config/class-hero-hub/backup-ssh:/run/secrets/backup-ssh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familyhero} -d ${POSTGRES_DB:-family_hero_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_restore_data:
  pgbackrest_repo_encrypted:
