[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=4
repo1-retention-diff=7
repo2-type=sftp
repo2-path=/home/administrator/offhost-pgbackrest/class-hero-hub
repo2-sftp-host=10.250.50.1
repo2-sftp-host-user=administrator
repo2-sftp-private-key-file=/run/secrets/backup-ssh/id_ed25519
repo2-sftp-public-key-file=/run/secrets/backup-ssh/id_ed25519.pub
repo2-sftp-known-host=/run/secrets/backup-ssh/known_hosts
repo2-sftp-host-key-check-type=strict
repo2-sftp-host-key-hash-type=sha256
repo2-cipher-type=aes-256-cbc
repo2-retention-full=4
repo2-retention-diff=7
start-fast=y
process-max=2
log-level-console=info
lock-path=/var/run/postgresql
spool-path=/var/run/postgresql
log-path=/var/log/pgbackrest

[fhh]
pg1-path=/var/lib/postgresql/data
pg1-user=classhero
